# Soporta colores con & y hex con &#RRGGBB
prefix: "&#FFAA00&lBattlepass &8» &7"

no-permission: "&cNo tenés permiso para hacer eso."
player-only: "&cEste comando solo lo puede usar un jugador."
player-not-found: "&cEl jugador &f%player% &cno está conectado."
invalid-number: "&cEl número ingresado no es válido."
unknown-command: "&cComando desconocido. Usá &f/bp help&c."
reloaded: "&aConfiguración recargada correctamente."

level-up: "&aSubiste al nivel &e%level% &adel pase de batalla."
points-gained: "&7Ganaste &b+%points% puntos &7del pase."
mission-completed: "&aCompletaste la misión &f%mission% &7(+%points% puntos)"
daily-reset: "&eLas misiones diarias se reiniciaron."

reward-claimed: "&aReclamaste la recompensa del nivel &e%level%&a."
reward-already-claimed: "&cYa reclamaste esa recompensa."
reward-locked-level: "&cTodavía no alcanzaste el nivel &f%level%&c."
need-premium: "&cDebés tener el pase premium para reclamar esto."
week-locked: "&cEsa semana todavía no está disponible."

# Nombre del tipo de recompensa (se usa en %type% de los títulos)
pass-type:
  free: "&aGratis"
  premium: "&dPremium"

# ------------------------------------------
#  Títulos y subtítulos
# ------------------------------------------
# enabled:  true/false para activar o desactivar ese título
# fade-in / stay / fade-out: duración en ticks (20 ticks = 1 segundo)
# delay: ticks de espera antes de mostrarlo (sirve para que un título no pise a otro)
# Colores con & y hex con &#RRGGBB
titles:
  mission-completed:
    enabled: true
    title: "&#FF0000¡Completaste una misión! 🔥"
    subtitle: "&#FFAA00Felicidades &8- &f%mission% &b(+%points% puntos)"
    fade-in: 10
    stay: 50
    fade-out: 20
    delay: 0

  reward-claimed:
    enabled: true
    title: "&#55FF55¡Recompensa reclamada! 🎁"
    subtitle: "&7Nivel &e%level% &8- %type%"
    fade-in: 10
    stay: 50
    fade-out: 20
    delay: 0

  level-up:
    enabled: true
    title: "&#FFDD55¡Subiste de nivel! ⭐"
    subtitle: "&7Ahora sos nivel &d%level% &7del pase"
    fade-in: 10
    stay: 60
    fade-out: 20
    # Se muestra un poco después para no tapar el título de la misión
    delay: 80

  daily-reset:
    enabled: true
    title: "&#55AAFF¡Nuevas misiones! 📜"
    subtitle: "&7Las misiones diarias se reiniciaron"
    fade-in: 10
    stay: 50
    fade-out: 20
    delay: 0

admin:
  premium-given: "&aLe diste el pase premium a &f%player%&a."
  premium-removed: "&aLe quitaste el pase premium a &f%player%&a."
  points-added: "&aLe diste &b%points% puntos &aa &f%player%&a."
  points-set: "&aLos puntos de &f%player% &aahora son &b%points%&a."
  season-started: "&aSe inició una nueva temporada desde hoy."

help:
  - "&8&m-----------------------------------"
  - "&#FFAA00&lUltimateBattlepass &7- Ayuda"
  - "&e/bp &7- Abre el menú del pase"
  - "&e/bp help &7- Muestra esta ayuda"
  - "&e/bp reload &7- Recarga las configuraciones"
  - "&e/bp addpoints <jugador> <puntos> &7- Da puntos"
  - "&e/bp setpoints <jugador> <puntos> &7- Fija los puntos"
  - "&e/bp premium <give|remove> <jugador> &7- Pase premium"
  - "&e/bp season start &7- Inicia una nueva temporada hoy"
  - "&8&m-----------------------------------"
