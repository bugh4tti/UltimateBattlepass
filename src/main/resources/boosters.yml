      - "&e▲ ¡Click derecho para activar!"

  talisman:
    type: OFFHAND
    multiplier: 2.0
    chance: 25
    glow: true
    material: TOTEM_OF_UNDYING
    name: "&#FFDD55✦ Talismán de Puntos"
    lore:
      - ""
      - "&7Mientras lo tengas en tu"
      - "&7&omano secundaria&7, tus misiones"
      - "&7pueden dar puntos extra."
      - ""
      - "&#FFDD55✎ Información:"
      - " &8▪ &7Multiplicador: &6x%multiplier%"
