# ==========================================
#  UltimateBattlepass - missions.yml
# ==========================================
# Tipos: BLOCK_BREAK, BLOCK_PLACE, MOB_KILL, PLAYER_KILL, PLAY_TIME (minutos), COMMAND
# target: material (STONE), mob (ZOMBIE), comando sin barra (spawn) o ANY para cualquiera.
# Los id no pueden llevar espacios ni puntos. No cambies un id con la misión en curso.
# Cada lista muestra hasta 7 misiones en el menú.
# Opcional: commands: ["eco give %player% 1000"] (se ejecutan al completar la misión)

# Misiones diarias: se reinician a la hora de daily-reset-time (06:00 Argentina)
daily:
  missions:
    minero:
      name: "Minero Diario"
      description:
        - "&7Rompe &f500 &7bloques."
      type: BLOCK_BREAK
      target: ANY
      amount: 500
      points: 25
    cazador:
      name: "Cazador Diario"
      description:
        - "&7Mata &f50 &7mobs."
      type: MOB_KILL
      target: ANY
      amount: 50
      points: 25
    guerrero:
      name: "Guerrero Diario"
      description:
        - "&7Mata a &f3 &7jugadores."
      type: PLAYER_KILL
      amount: 3
      points: 25
    jugador:
      name: "Jugador Activo"
      description:
        - "&7Juega durante &f30 &7minutos."
      type: PLAY_TIME
      amount: 30
      points: 25

