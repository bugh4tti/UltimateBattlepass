# ==========================================
#  UltimateBattlepass - missions.yml
# ==========================================
# Tipos: BLOCK_BREAK, BLOCK_PLACE, MOB_KILL, PLAYER_KILL, PLAY_TIME (minutos), COMMAND, FISH
# target: material (STONE), mob (ZOMBIE), ítem pescado (COD), comando sin barra (spawn) o ANY.
# Los id no pueden llevar espacios ni puntos. No cambies un id con la misión en curso.
# Cada lista muestra hasta 7 misiones en el menú.
#
# Opcionales:
#   unit: texto que se ve en la bossbar y en el mini mensaje (ej: "Peces").
#         Si no lo ponés, se usa uno por tipo (bloques, mobs, jugadores, minutos, usos, peces).
#   messages: líneas que se envían al completar la misión (%player%, %mission%, %points%).
#   commands: comandos que se ejecutan al completarla (ej: ["eco give %player% 1000"]).

# Misiones diarias: se reinician a la hora de daily-reset-time (06:00 Argentina)
daily:
  missions:
    minero:
      name: "Minero Diario"
      description:
        - "&7Rompe &f500 &7bloques."
      type: BLOCK_BREAK
      target: ANY
      amount: 500
      points: 25
      unit: "Bloques"
    cazador:
      name: "Cazador Diario"
      description:
        - "&7Mata &f50 &7mobs."
      type: MOB_KILL
      target: ANY
      amount: 50
      points: 25
      unit: "Mobs"
    guerrero:
      name: "Guerrero Diario"
      description:
        - "&7Mata a &f3 &7jugadores."
      type: PLAYER_KILL
      amount: 3
      points: 25
      unit: "Jugadores"
    jugador:
      name: "Jugador Activo"
      description:
        - "&7Juega durante &f30 &7minutos."
      type: PLAY_TIME
      amount: 30
      points: 25
      unit: "Minutos"
    pescador:
      name: "Pesca"
      description:
        - "&7Pesca &f10 &7peces."
      type: FISH
      target: ANY
      amount: 10
      points: 25
      unit: "Peces"
      messages:
        - "&7¡Buena pesca, &f%player%&7!"

