# ==========================================
#  UltimateBattlepass - rewards.yml
# ==========================================
# display: líneas que ve el jugador en el menú.
# commands: comandos que se ejecutan al reclamar (por consola).
#   %player% = nombre del jugador.
#   Prefijos opcionales: [player] comando, [console] comando, [message] texto.
# CAMBIA los comandos "eco give" y "essences give" por los de tu servidor.

